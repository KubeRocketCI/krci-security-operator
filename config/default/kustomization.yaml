# Adds namespace to all resources.
namespace: krci-security-operator-system

# Value of this field is prepended to the names of all resources.
namePrefix: krci-security-operator-

resources:
- ../rbac
- ../manager
# Expose the controller manager metrics service.
- metrics_service.yaml

patches:
# Enable the metrics endpoint using HTTPS and the port :8443.
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
