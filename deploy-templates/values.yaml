# -- component name
name: krci-security-operator

# -- Annotations to add to the deployment
annotations: {}

# -- Node labels for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity for pod assignment
affinity: {}

image:
  # -- krci-security-operator image registry. Leave empty to use the repository as-is (Docker Hub by default)
  registry: ""
  # -- krci-security-operator Docker image name. The released image can be found on [Dockerhub](https://hub.docker.com/r/epamedp/krci-security-operator)
  repository: epamedp/krci-security-operator
  # -- krci-security-operator Docker image tag. The released image can be found on [Dockerhub](https://hub.docker.com/r/epamedp/krci-security-operator). If not defined then .Chart.AppVersion is used
  tag:

# -- Image pull policy
imagePullPolicy: "IfNotPresent"

# -- Optional array of imagePullSecrets containing private registry credentials
## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry
imagePullSecrets: []
# - name: regcred

# -- Additional volumes to add to the manager pod
extraVolumes: []

# -- Additional volume mounts to add to the manager container
extraVolumeMounts: []

# -- Resource requests/limits for the manager container. Memory scales with `concurrency` multiplied by one page of 10 full Trivy reports (a report can reach 3 MB), plus the metadata of all reports in the cluster, plus the names, container names, image references, components and label tags of the workloads of a namespace (read 500 at a time) and the metadata of the reports of one kind of a namespace: raise the memory limit when `concurrency`, the report sizes or the number of workloads grow.
## Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

# -- Pod-level security context
## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context
## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

defectdojo:
  # -- Secret in the release namespace with the keys `url` and `token` of the cluster's DefectDojo. The operator reads it at runtime and never writes it
  secretName: defectdojo-credentials
  # -- DefectDojo Product Type of the namespace products. Use one value for every operator that writes to the same DefectDojo; a product that exists under another Product Type fails its reimports
  productType: KubeRocketCI

# -- Required, no default. Unique name of this cluster in the DefectDojo: a lowercase RFC 1123 DNS label. Every namespace product is named `<clusterName>/<namespace>`, and the operator closes only the tests of its own cluster
clusterName: ""

# -- Glob patterns of namespaces that are skipped
excludeNamespaces: []

# -- Prefixes stripped from the Argo CD application name when the component tag is derived
componentPrefixes:
  - in-cluster-

labelTags:
  # -- Keys of Namespace labels that are copied into tags `<key>:<value>` of the namespace product, for example `app.edp.epam.com/tenant`. Each key must be a valid Kubernetes label key of at most 191 characters, so that its tag fits 255 characters with a label value of 63 characters. A key that breaks this, a repeated key, keys that differ in case only, and a key whose tag key the operator writes itself (`k8s-cluster`, `k8s-namespace`, `k8s-workload`, `k8s-container`, `oci-image`, `app`, `report-kind`) stop the operator at start. The operator owns the product tags of the listed keys: it corrects and removes them, and keeps every other tag. Empty copies none
  namespace: []
  # -- Keys of workload labels that are copied into tags `<key>:<value>` of the tests of the workload. A label is read from the Deployment, StatefulSet, DaemonSet or CronJob, from a Job that has no CronJob, or from a Pod, the object the `app` tag is read from; a ReplicaSet without a Deployment has none. The key rules are those of `labelTags.namespace`. A change of the list uploads once every test whose tags change. Empty copies none
  workload: []

# -- Interval of the periodic re-check of every namespace (Go duration, at least 1m)
resyncPeriod: 30m

# -- Number of namespaces reconciled in parallel
concurrency: 2

# -- Trivy Operator report kinds to import. Supported: `VulnerabilityReport`, `ExposedSecretReport`. The tests of a kind the cluster does not serve stay open; remove the kind to close them
reportKinds:
  - VulnerabilityReport
  - ExposedSecretReport

metrics:
  # -- Serve the Prometheus metrics of the manager over plain HTTP on `metrics.port` of the pod. The chart creates no Service for them
  enabled: false
  # -- Container port of the metrics endpoint
  port: 8080
